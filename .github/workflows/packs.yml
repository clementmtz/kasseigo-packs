# Builds the KasseiGo city packs and publishes them in this repository's release "packs".
# The app downloads them from https://github.com/clementmtz/kasseigo-packs/releases/download/packs/
# The engine that builds them lives in the private repository clementmtz/kasseigo, read with a
# read-only deploy key (secret SOURCE_DEPLOY_KEY).
name: City packs

on:
  schedule:
    - cron: "0 3 * * 1" # every Monday at 03:00 UTC: OpenStreetMap changes every day
  workflow_dispatch:

permissions:
  contents: write

jobs:
  packs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Actions pinned to a commit: this job holds the deploy key and writes the files every
      # phone downloads; a moved tag must not change what runs here.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: clementmtz/kasseigo
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          path: src
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # branch stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y osmium-tool
      - name: Engine tests
        working-directory: src
        run: cargo test --release -p kasseigo_core
      - name: Packs
        working-directory: src
        run: |
          for city in brussels paris; do
            backend/packs/build.sh "$city"
          done
      # Each pack under a name of its own content, the list signed, then the manifest last, then
      # files no manifest names any more: an app never sees a manifest that does not match its files.
      # The list signed with the key set by kasseigo/backend/packs/keygen.sh (secret PACKS_SIGNING_KEY,
      # given to this step only), by the engine's tool the packs were just built with.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          PACKS_SIGNING_KEY: ${{ secrets.PACKS_SIGNING_KEY }}
        run: python3 src/backend/packs/publish.py "$GITHUB_REPOSITORY" src/backend/packs/dist --signer src/target/release/kasseigo
